    timeout-minutes: 30
    outputs:
      exit_code: ${{ steps.record.outputs.exit_code }}
      log_sha256: ${{ steps.record.outputs.log_sha256 }}
      step_script_sha256: ${{ steps.record.outputs.step_script_sha256 }}
      started_at: ${{ steps.record.outputs.started_at }}
