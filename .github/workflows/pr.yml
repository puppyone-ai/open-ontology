          sha=$(sha256sum "${RUNNER_TEMP}/gate-clippy.log" | awk '{print $1}')
          script=$(printf '%s' 'cargo clippy --workspace --locked --all-targets -- -D warnings' | sha256sum | awk '{print $1}')
          {
            echo "exit_code=${code}"
            echo "log_sha256=${sha}"
            echo "step_script_sha256=${script}"
            echo "started_at=${started}"
            echo "finished_at=${finished}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"
          exit "${code}"
      - name: preserve failure log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-clippy-${{ github.run_id }}
