        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: gates
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          COMMIT: ${{ github.sha }}
          DOCS_EXIT: ${{ needs.gate-docs.outputs.exit_code }}
          DOCS_LOG: ${{ needs.gate-docs.outputs.log_sha256 }}
          FMT_EXIT: ${{ needs.gate-fmt.outputs.exit_code }}
          FMT_LOG: ${{ needs.gate-fmt.outputs.log_sha256 }}
          CLIPPY_EXIT: ${{ needs.gate-clippy.outputs.exit_code }}
          CLIPPY_LOG: ${{ needs.gate-clippy.outputs.log_sha256 }}
          UNIT_EXIT: ${{ needs.gate-unit.outputs.exit_code }}
          UNIT_LOG: ${{ needs.gate-unit.outputs.log_sha256 }}
          CONTRACTS_EXIT: ${{ needs.gate-contracts.outputs.exit_code }}
          CONTRACTS_LOG: ${{ needs.gate-contracts.outputs.log_sha256 }}
          ARCHITECTURE_EXIT: ${{ needs.gate-architecture.outputs.exit_code }}
