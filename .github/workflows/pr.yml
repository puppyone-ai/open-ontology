# Pull request and manual engineering checks.
# actions/checkout 7.0.1 @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (2026-07-17)
# actions/upload-artifact 7.0.1 @ 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (2026-04-10)
# dtolnay/rust-toolchain @ 02cb101ec7c40f2c49e1d9714d64511d8e1b74de (2026-09-12)
# rustc is pinned to 1.98.1. The cache action is unused.
# Unused cache key: cargo-lock-1.98.1-${{ hashFiles('Cargo.lock') }}
# Repository credentials stay unset. Forks receive none.
# A green job is not phase sign-off and is not branch protection.
# Aggregate does not treat imported job outputs as required_satisfied.
# Authenticated GitHub provenance stays pending. There is no signing key here.

name: pr

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-docs:
    name: gate-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      exit_code: ${{ steps.record.outputs.exit_code }}
      log_sha256: ${{ steps.record.outputs.log_sha256 }}
      step_script_sha256: ${{ steps.record.outputs.step_script_sha256 }}
      started_at: ${{ steps.record.outputs.started_at }}
      finished_at: ${{ steps.record.outputs.finished_at }}
      run_id: ${{ steps.record.outputs.run_id }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: docs
        id: record
        shell: bash
        run: |
          set -o pipefail
          rustc --version | tee "${RUNNER_TEMP}/rustc.txt"
          grep -q '^rustc 1.98.1 ' "${RUNNER_TEMP}/rustc.txt"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          cargo xtask docs --check --format json | tee "${RUNNER_TEMP}/gate-docs.log"
          code=${PIPESTATUS[0]}
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sha=$(sha256sum "${RUNNER_TEMP}/gate-docs.log" | awk '{print $1}')
          script=$(printf '%s' 'cargo xtask docs --check --format json' | sha256sum | awk '{print $1}')
          {
            echo "exit_code=${code}"
            echo "log_sha256=${sha}"
            echo "step_script_sha256=${script}"
            echo "started_at=${started}"
            echo "finished_at=${finished}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"
          exit "${code}"
      - name: preserve failure log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-docs-${{ github.run_id }}
          path: ${{ runner.temp }}/gate-docs.log
          retention-days: 14
          if-no-files-found: ignore

  gate-fmt:
