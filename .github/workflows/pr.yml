  aggregate:
    name: aggregate
    permissions:
      contents: read
      actions: read
    needs:
      - gate-docs
      - gate-fmt
      - gate-clippy
      - gate-unit
      - gate-contracts
      - gate-architecture
      - secret-scan
      - gate-dependencies
      - gate-evidence
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
