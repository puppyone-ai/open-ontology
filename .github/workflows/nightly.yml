# Nightly run of the gates that are active in SP00.
# Future A-F suites stay in ci/gates.yaml as not_applicable_until_phase.
# This file does not add a success job for those suites.
# actions/checkout 7.0.1 @ 3d3c42e5aac5ba805825da76410c181273ba90b1 (2026-07-17)
# actions/upload-artifact 7.0.1 @ 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a (2026-04-10)
# dtolnay/rust-toolchain @ 02cb101ec7c40f2c49e1d9714d64511d8e1b74de (2026-09-12)
# rustc is pinned to 1.98.1. The cache action is unused.
# Unused cache key: cargo-lock-1.98.1-${{ hashFiles('Cargo.lock') }}
# Repository credentials stay unset.
# A green job is not phase sign-off and is not branch protection.
# Aggregate verifies GitHub API job identity and immutable artifact digests.
# No local JSON can claim execution. Release authority and branch protection stay separate.

name: nightly

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  engine-matrix:
    name: engine-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: P0 source audit and regression matrix
        shell: bash
        run: |
          set -o pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 ci/nightly_matrix.py \
            | tee "${RUNNER_TEMP}/engine-matrix.log"
      - name: owner-visible result
        if: always()
        shell: bash
        run: |
          {
            echo '## Engine matrix'
            echo 'Missing hooks/images fail closed. This job is not product sign-off.'
            cat "${RUNNER_TEMP}/engine-matrix.log"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: preserve engine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: engine-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/h-s5-*/**/*.json
            evidence/h-s5-*/**/*.stdout
            evidence/h-s5-*/**/*.stderr
            evidence/h-s5-*/**/SHA256SUMS
            ${{ runner.temp }}/engine-matrix.log
          retention-days: 14
          if-no-files-found: error

  gate-docs:
    name: gate-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      exit_code: ${{ steps.record.outputs.exit_code }}
      log_sha256: ${{ steps.record.outputs.log_sha256 }}
      step_script_sha256: ${{ steps.record.outputs.step_script_sha256 }}
      started_at: ${{ steps.record.outputs.started_at }}
      finished_at: ${{ steps.record.outputs.finished_at }}
      run_id: ${{ steps.record.outputs.run_id }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: generated operator references
        run: python3 ci/check_generated_docs.py
      - name: docs
        id: record
        shell: bash
        run: |
          set -o pipefail
          rustc --version | tee "${RUNNER_TEMP}/rustc.txt"
          grep -q '^rustc 1.98.1 ' "${RUNNER_TEMP}/rustc.txt"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          cargo xtask docs --check --format json | tee "${RUNNER_TEMP}/gate-docs.log"
          code=${PIPESTATUS[0]}
          set -e
          finished=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sha=$(sha256sum "${RUNNER_TEMP}/gate-docs.log" | awk '{print $1}')
          script=$(printf '%s' 'cargo xtask docs --check --format json' | sha256sum | awk '{print $1}')
          {
            echo "exit_code=${code}"
            echo "log_sha256=${sha}"
            echo "step_script_sha256=${script}"
            echo "started_at=${started}"
            echo "finished_at=${finished}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "${GITHUB_OUTPUT}"
          python3 ci/gate_receipts.py record --gate gate-docs --log "${RUNNER_TEMP}/gate-docs.log" --output "${RUNNER_TEMP}/gate-docs-receipt.json" --exit-code "${code}" --started "${started}" --finished "${finished}"
          exit "${code}"
      - name: preserve failure log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-docs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
