  aggregate:
    name: aggregate
    needs:
      - gate-docs
      - gate-fmt
      - gate-clippy
      - gate-unit
      - gate-contracts
      - gate-architecture
      - secret-scan
      - gate-dependencies
      - gate-evidence
      - gate-integration-a
      - gate-security-b
      - gate-ontology-d
      - gate-nightly-a-m
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify authenticated run and immutable artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          else
            base="$(git rev-parse HEAD)"
          fi
          git cat-file -e "${base}^{commit}"
          python3 -m unittest discover -s ci -p 'test_gate_receipts.py'
          python3 ci/gate_receipts.py verify --base "$base" | tee "$RUNNER_TEMP/aggregate.log"
      - name: Preserve aggregate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate.log
          retention-days: 14
          if-no-files-found: error
