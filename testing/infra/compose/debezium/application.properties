# Pending Debezium Server recipe. up.sh does not start this process.
# P3 offset/history and P11 routing are not accepted by this file.
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=pg-agent-primary
debezium.source.database.port=5432
debezium.source.database.user=oo_fixture_admin
debezium.source.database.password=${file:/run/secrets/pg_agent_password}
debezium.source.database.dbname=oo_agent
debezium.source.topic.prefix=oolocal
debezium.source.plugin.name=pgoutput
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=oo_local_pending
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schemahistory.dat
debezium.sink.type=http
debezium.sink.http.url=http://127.0.0.1:9/unused
