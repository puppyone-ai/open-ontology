    labels:
      oo.project: open-ontology
      oo.owner: env
      oo.run_id: ${OO_RUN_ID}
      oo.scope: sp00-infra-fixture

secrets:
  pg_control_password:
    file: ${OO_SECRET_DIR}/pg_control_password
  pg_agent_password:
    file: ${OO_SECRET_DIR}/pg_agent_password
  replication_password:
    file: ${OO_SECRET_DIR}/replication_password
  agent_ro_password:
    file: ${OO_SECRET_DIR}/agent_ro_password
  mysql_root_password:
    file: ${OO_SECRET_DIR}/mysql_root_password
  mysql_reader_password:
    file: ${OO_SECRET_DIR}/mysql_reader_password
  valkey_buffer_password:
    file: ${OO_SECRET_DIR}/valkey_buffer_password
  valkey_state_password:
    file: ${OO_SECRET_DIR}/valkey_state_password
