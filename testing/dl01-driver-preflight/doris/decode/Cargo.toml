[package]
name = "doris-decode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Independent Arrow decode for the Doris preflight. Does not depend on the reader."

[dependencies]
arrow-array = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
