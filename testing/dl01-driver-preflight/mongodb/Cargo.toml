[workspace]
resolver = "2"
members = ["smoke", "probe", "decode"]

[workspace.dependencies]
mongodb = { version = "=3.3.0", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
mongodb-internal-macros = "=3.3.0"
tokio = { version = "=1.53.2", features = ["rt", "time", "sync", "net", "macros", "io-util"] }
arrow-array = "=60.0.0"
arrow-buffer = "=60.0.0"
arrow-ipc = "=60.0.0"
arrow-schema = "=60.0.0"
serde_json = "=1.0.151"
serde = "=1.0.229"
bson = "=2.15.0"
mongocrypt = { version = "=0.3.2", default-features = false }

[profile.dev]
debug = 1
