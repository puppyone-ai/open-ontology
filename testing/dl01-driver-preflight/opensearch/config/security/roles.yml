---
_meta:
  type: "roles"
  config_version: 2

all_access:
  reserved: false
  cluster_permissions:
    - "cluster:*"
  index_permissions:
    - index_patterns:
        - "*"
      allowed_actions:
        - "indices:*"
  tenant_permissions: []

# Customer ledger is the live scenario. Its grant is read and PIT only.
# mget, write, create-index, and cluster task-cancel are not granted.
# The workload index is the customer cancel/deadline index, search and PIT only.
# Older exact names stay so the historical fixture surface is still described.
# No cluster:admin/tasks/cancel permission is added.
oo_dl01w1_44_reader:
  reserved: false
  cluster_permissions: []
  index_permissions:
    - index_patterns:
        - "oo-dl01w1-44-ledger"
      allowed_actions:
        - "indices:data/read/search"
        - "indices:data/read/search*"
        - "indices:data/read/get"
        - "indices:data/read/count"
        - "indices:admin/mappings/get"
        - "indices:admin/mappings/fields/get"
        - "indices:admin/get"
        - "indices:data/read/point_in_time/create"
        - "indices:data/read/point_in_time/delete"
    - index_patterns:
        - "oo-dl01w1-44-workload"
      allowed_actions:
        - "indices:data/read/search"
        - "indices:data/read/point_in_time/create"
        - "indices:data/read/point_in_time/delete"
    - index_patterns:
        - "oo-dl01w1-44-synthetic"
      allowed_actions:
        - "indices:data/read/search"
        - "indices:data/read/search*"
        - "indices:data/read/get"
        - "indices:data/read/mget"
        - "indices:data/read/count"
        - "indices:admin/mappings/get"
        - "indices:admin/mappings/fields/get"
        - "indices:admin/get"
        - "indices:data/read/point_in_time/create"
        - "indices:data/read/point_in_time/delete"
    - index_patterns:
        - "oo-dl01w1-44-cancel"
      allowed_actions:
        - "indices:data/read/search"
    - index_patterns:
        - "oo-dl01w1-44-shape"
      allowed_actions:
        - "indices:data/read/search"
  tenant_permissions: []
