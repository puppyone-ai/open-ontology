[package]
name = "ch-reader"
description = "Native ClickHouse HTTP reader for the DL01-W1-40 preflight. Not a shared connector."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
# Pins copied from base 577160c22de63adb9b38e0147f3bc2da893c4d9d.
# reqwest stays on cleartext HTTP/1. The official clickhouse crate is not in that lock.
arrow-array = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
cc = "=1.4.7"
find-msvc-tools = "=0.1.13"
hyper-util = { version = "=0.1.20", default-features = false }
reqwest = { version = "=0.13.5", default-features = false }
smallvec = { version = "=1.16.1", default-features = false }
yoke-derive = "=0.8.2"
zerocopy = { version = "=0.8.57", default-features = false }
zerocopy-derive = "=0.8.57"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
