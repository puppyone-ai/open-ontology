[workspace]
resolver = "2"
members = ["reader", "decode"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
