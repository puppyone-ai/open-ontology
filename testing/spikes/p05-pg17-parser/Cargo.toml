[package]
name = "oo-p05-pg17-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "SP01 P5 PG17 parser admission prototype. Not a product crate."

[workspace]

[features]
default = []
test-hooks = []

[dependencies]
pg_query = "=6.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"

# Resolver pins for the 7*86400s floor at 2026-10-01T23:07:52Z.
# Newest cc, find-msvc-tools, and lazy_static were younger than that floor.
cc = "=1.4.7"
find-msvc-tools = "=0.1.13"
lazy_static = "=1.5.0"

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lib]
name = "oo_p05_pg17_parser"
path = "src/lib.rs"

[[bin]]
name = "oo-p05-pg17-parser-smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "oo-p05-parser-worker"
path = "src/bin/worker.rs"

[[test]]
name = "corpus"
path = "tests/corpus.rs"

[[test]]
name = "frame"
path = "tests/frame.rs"

[[test]]
name = "ipc"
path = "tests/ipc.rs"
required-features = ["test-hooks"]
