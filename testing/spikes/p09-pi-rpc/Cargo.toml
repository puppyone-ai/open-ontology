[package]
name = "oo-p09-pi-rpc"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "SP10-W04 Pi RPC stdio probe. Not a product crate. Does not accept H-D01."

[workspace]
resolver = "3"

[lib]
name = "oo_p09_pi_rpc"
path = "src/lib.rs"

[[bin]]
name = "pi-rpc-stub"
path = "src/bin/stub.rs"

[[bin]]
name = "pi-rpc-live"
path = "src/bin/live.rs"
