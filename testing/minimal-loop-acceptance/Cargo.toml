[package]
name = "minimal-loop-acceptance"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
publish = false
description = "External runner for the minimal product loop. It does not accept the parent goal."

[workspace]
resolver = "3"

[[bin]]
name = "minimal-loop-acceptance"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
