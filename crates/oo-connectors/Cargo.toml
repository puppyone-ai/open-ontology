[package]
name = "oo-connectors"
description = "Read-only PostgreSQL, MySQL and opt-in Oracle source inspection and bounded Arrow reads."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
default = []
mysql = ["dep:mysql_async", "tokio/sync", "tokio/macros"]
# In-process MySQL binlog C1. Not default: its zstd stack is admitted for the
# default artifact only after the seven-day rule (supply-chain/mysql-binlog-audit.json).
mysql-binlog = ["mysql", "mysql_async/binlog", "dep:futures-util"]
oracle = ["dep:oracledb"]
# ClickHouse, Doris and StarRocks over the MySQL wire protocol; no new driver.
olap = ["mysql"]
mongodb = ["dep:mongodb", "dep:mongodb-internal-macros"]
opensearch = ["dep:reqwest"]
sqlserver = ["dep:tiberius", "dep:tokio-util", "dep:futures-util", "tokio/net", "tokio/io-util"]

[[bin]]
name = "oo-oracle-source"
path = "src/oracle/main.rs"
required-features = ["oracle"]

[dependencies]
mongodb = { version = "=3.3.0", optional = true, default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
mongodb-internal-macros = { version = "=3.3.0", optional = true }
reqwest = { version = "=0.13.5", optional = true, default-features = false, features = ["rustls", "http2"] }
# Already locked by other workspace crates; only mysql-binlog uses it here.
futures-util = { version = "=0.3.34", optional = true, default-features = false, features = ["std"] }
oo-core = { path = "../oo-core" }
oo-stack = { path = "../oo-stack" }
russh = { version = "=0.65.0", default-features = false, features = ["ring"] }
# Series 60, the same crates the workspace Arrow type names describe.
# Default features stay off. `public-dependency` is unstable on Rust 1.94,
# so these stay private. `TypedBatch::record_batch` returns `RecordBatch`.
arrow-array = { version = "=60.0.0", default-features = false }
arrow-buffer = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
# Uncompressed Arrow IPC. Series 60, the same pin as the array crates.
# Default features stay off, so lz4_flex and zstd are not enabled.
arrow-ipc = { version = "=60.0.0", default-features = false }
# Source driver only. Default features stay off, so `any`, macros, and the
# JSON type feature stay off. The sqlx 0.9.0 facade still depends on
# sqlx-core with the `migrate` feature unconditionally. This crate does not
# call migrate. TLS is the patched sqlx-core feature `_tls-rustls-ring-no-roots`:
# rustls ring provider, empty root store, caller CA only. Do not enable
# `tls-rustls-ring-webpki`, `tls-rustls-ring-native-roots`, or `tls-native-tls`.
# No mysql, sqlite, or tls-none.
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
sqlx-core = { version = "=0.9.0", default-features = false, features = [
    "_rt-tokio",
    "_tls-rustls-ring-no-roots",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.3", default-features = false, features = ["time", "net", "rt", "macros", "sync", "io-util"] }
mysql_async = { version = "=0.37.1", optional = true, default-features = false, features = ["minimal-rust", "native-tls-tls"] }
# The source cursor uses the driver without its optional Arrow 59 dependency.
# All product IPC continues to use the workspace's Arrow 60 types.
oracledb = { version = "=26.0.0-beta.4", optional = true, default-features = false }
tiberius = { version = "=0.13.0", optional = true, default-features = false, features = ["tds73", "rustls"] }
tokio-util = { version = "=0.7.19", optional = true, default-features = false, features = ["compat"] }
unicode-normalization = "=0.1.25"
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
arrow-array = { version = "=60.0.0", default-features = false }
arrow-ipc = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "=1.53.3", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
