<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ontology / Field Atlas</title>
<style>
:root{--paper:#f5f2e9;--ink:#24372f;--line:#c8cbbb;--accent:#a43f23;--row:44px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#dce8d8,transparent 65%),var(--paper);color:var(--ink);font:15px Georgia,serif}header{padding:24px 4vw;border-bottom:1px solid var(--line)}h1{font-size:38px;font-weight:normal;margin:4px 0}small,.eyebrow{font:12px monospace;letter-spacing:.06em}.eyebrow{color:var(--accent)}.tools{display:flex;gap:16px;flex-wrap:wrap;margin:22px 0 12px}label{display:grid;gap:5px;font:12px monospace}input,select{font:15px Georgia,serif;padding:10px;border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink);max-width:300px}main{display:grid;grid-template-columns:minmax(260px,32%) 1fr;gap:25px;padding:24px 4vw}#list{height:440px;overflow:auto;position:relative;border:1px solid var(--line)}#rows{position:absolute;inset:0 0 auto}button.entity{height:var(--row);width:100%;display:block;text-align:left;padding:0 12px;background:var(--paper);border:0;border-bottom:1px solid var(--line);font:15px Georgia,serif;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}button:hover,button[aria-pressed=true]{background:#dce8d8}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}canvas{width:100%;height:180px;border-bottom:1px solid var(--line)}h2{font-size:28px;font-weight:normal;margin:18px 0}h3{font:14px monospace;color:var(--accent);margin-top:25px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 monospace;max-height:260px;overflow:auto;padding:12px;background:#ffffff60}details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer}#count{margin-bottom:10px;font:12px monospace}#notice{max-width:85ch;line-height:1.5}@media(max-width:700px){main{grid-template-columns:1fr}#list{height:220px}.tools{gap:10px}h1{font-size:30px}}
</style>
<header><div class="eyebrow">OPEN ONTOLOGY / FIELD ATLAS</div><h1>A map of what you can see.</h1><small id="role"></small><p id="notice">Offline role-Pack snapshot. Source-schema domains and role-visible communities are navigation aids, not certification. No publication, authorization or runtime verification implied.</p><div class="tools"><label>Search entities<input id="search" type="search" placeholder="Name, alias or table"></label><label>Domain<select id="domain"><option value="">All domains</option></select></label><label>Community<select id="community"><option value="">All communities</option></select></label></div></header>
<main><section aria-label="Entities"><div id="count" role="status"></div><div id="list" tabindex="0" aria-label="Scrollable entity list"><div id="spacer"></div><div id="rows"></div></div></section><section aria-label="Entity detail"><canvas id="map" aria-label="Community overview; use the entity list to explore"></canvas><h2 id="title">Select an entity</h2><div id="detail"></div></section></main>
<script>
'use strict';
const started = performance.now();
const pack = /*PACK_DATA*/null;
const $ = id => document.getElementById(id);
$('role').textContent = 'ROLE / ' + pack.role + '  -  ' + pack.entities.length + ' ENTITIES';
const tables = new Map(pack.tables.map(t => [t.dataset,t]));
const columns = new Map(), relations = new Map();
for (const c of pack.columns) { if (!columns.has(c.dataset)) columns.set(c.dataset,[]); columns.get(c.dataset).push(c); }
for (const r of pack.relationships) for (const name of new Set([r.from.dataset,r.to.dataset])) { if (!relations.has(name)) relations.set(name,[]); relations.get(name).push(r); }
const communities = [...new Set(pack.entities.map(e=>e.community))].sort();
for (const [id,values] of [['domain',[...new Set(pack.entities.map(e=>e.domain))].sort()],['community',communities]]) for (const value of values) { const o=document.createElement('option');o.value=value;o.textContent=id==='community'?'Community '+(communities.indexOf(value)+1):value;$(id).append(o); }
const searchIndex = pack.entities.map(e=>[e.id,e.canonical_name,...(e.aliases||[]),e.main_table,...e.related_tables].join(' ').toLowerCase());
// Fixed coordinates are computed once; filtering never restarts a force layout.
const positions = pack.entities.map((e,i)=>({x:20+(i%50)*19,y:14+Math.floor(i/50)*8,community:communities.indexOf(e.community)}));
const canvas=$('map');canvas.width=1000;canvas.height=Math.max(180,Math.ceil(positions.length/50)*8+20);
const ctx=canvas.getContext('2d');for(const p of positions){ctx.fillStyle=['#38654d','#a43f23','#ac872d','#627e86'][p.community%4];ctx.fillRect(p.x,p.y,5,5);}
let filtered=pack.entities.map((_,i)=>i), selected=-1;
function render(){const start=Math.max(0,Math.floor($('list').scrollTop/44)-2);const end=Math.min(filtered.length,start+Math.ceil($('list').clientHeight/44)+4);$('rows').replaceChildren();$('rows').style.transform='translateY('+(start*44)+'px)';$('spacer').style.height=(filtered.length*44)+'px';for(let n=start;n<end;n++){const index=filtered[n],e=pack.entities[index],b=document.createElement('button');b.className='entity';b.textContent=e.canonical_name;b.title=e.id;b.setAttribute('aria-pressed',String(index===selected));b.onclick=()=>select(index);$('rows').append(b);}}
function block(title,text,parent=$('detail')){const h=document.createElement('h3');h.textContent=title;const pre=document.createElement('pre');pre.textContent=text;parent.append(h,pre);}
function select(index){selected=index;const e=pack.entities[index];$('title').textContent=e.canonical_name;$('detail').replaceChildren();block('Entity',JSON.stringify(e,null,2));const names=new Set([e.main_table,...e.related_tables,...e.members]);const related=new Map();for(const name of names){block('Table / '+name,JSON.stringify({table:tables.get(name),columns:columns.get(name)||[]},null,2));for(const r of relations.get(name)||[])related.set(r.id,r);}block('Relations',JSON.stringify([...related.values()],null,2));const h=document.createElement('h3');h.textContent='Role-visible metrics (Pack-wide; no entity attribution inferred)';$('detail').append(h);if(!pack.metrics.length)block('Metrics','No visible metrics.');for(const metric of pack.metrics){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=metric.path;d.append(s);d.addEventListener('toggle',()=>{if(d.open&&!d.querySelector('pre'))block('Definition',metric.text,d);});$('detail').append(d);}render();}
function filter(){const q=$('search').value.toLowerCase(),d=$('domain').value,c=$('community').value;filtered=[];pack.entities.forEach((e,i)=>{if((!d||e.domain===d)&&(!c||e.community===c)&&searchIndex[i].includes(q))filtered.push(i);});$('count').textContent=filtered.length+' / '+pack.entities.length+' entities';$('list').scrollTop=0;render();}
$('search').addEventListener('input',filter);$('domain').addEventListener('change',filter);$('community').addEventListener('change',filter);$('list').addEventListener('scroll',render);window.addEventListener('resize',render);filter();
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.documentElement.dataset.renderMs=(performance.now()-started).toFixed(2);document.documentElement.dataset.layoutPasses='1';}));
</script>
</html>
