[package]
name = "oo-control"
description = "Control API. Local upload sessions are implemented; plan, apply, secrets, and RBAC are not."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
getrandom = { version = "=0.2.17", default-features = false, features = ["std"] }
object_store = { version = "=0.14.2", default-features = false, features = ["fs"] }
oo-core = { path = "../oo-core" }
oo-jobs = { path = "../oo-jobs" }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[dev-dependencies]
object_store = { version = "=0.14.2", default-features = false, features = ["fs"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }
