[package]
name = "oo-product-stack"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Product-stack preflight, health, and journey oracle. Not parent acceptance."

[lib]
name = "oo_product_stack"
path = "src/lib.rs"

[[bin]]
name = "oo-product-stack"
path = "src/main.rs"

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
