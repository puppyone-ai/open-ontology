[workspace]
resolver = "3"

[package]
name = "oo-pi-runtime-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
publish = false
description = "Verify and probe the pinned Pi runtime kit. Does not accept the parent items."
autobins = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "kit"
path = "src/main.rs"
