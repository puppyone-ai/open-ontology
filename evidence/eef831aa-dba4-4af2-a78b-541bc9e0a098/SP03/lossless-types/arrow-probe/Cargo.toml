[workspace]

[package]
name = "oo-a098-arrow-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Isolated Arrow series 60 RecordBatch probe. Not a workspace member."

[dependencies]
arrow-array = { version = "=60.0.0", default-features = false }
arrow-buffer = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
