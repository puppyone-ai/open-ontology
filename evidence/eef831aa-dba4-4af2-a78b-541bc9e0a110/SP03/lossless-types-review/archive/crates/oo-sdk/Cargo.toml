[package]
name = "oo-sdk"
description = "Bounded Rust client for Gateway POST /v1/query JSON."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
oo-core = { path = "../oo-core" }
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "=1.53.1", default-features = false, features = ["time"] }
# Reviewed transitive pins for reqwest 0.13.5. Not SDK APIs.
# hyper-util 0.1.21, tokio-rustls 0.26.6, and rustls-platform-verifier 0.7.1
# were refused when this combination was first reviewed. Keep those pins.
hyper-util = { version = "=0.1.20", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
# cc 1.5.1 and find-msvc-tools 0.1.14 were inside the 168-hour window on
# 2026-10-02. aws-lc-sys builds with the older pair.
cc = "=1.4.7"
find-msvc-tools = "=0.1.13"
# yoke-derive 0.8.4 was published 2026-09-30. idna/url still build with 0.8.2.
yoke-derive = "=0.8.2"

[dev-dependencies]
oo-core = { path = "../oo-core" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
socket2 = "=0.6.5"

[lints]
workspace = true
