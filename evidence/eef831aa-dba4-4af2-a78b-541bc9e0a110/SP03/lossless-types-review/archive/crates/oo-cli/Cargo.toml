[package]
name = "oo-cli"
description = "Data CLI for one Gateway JSON query. Other commands are not implemented."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
oo-core = { path = "../oo-core" }
oo-sdk = { path = "../oo-sdk" }
# Already locked by oo-sdk. No new registry version.
libc = "=0.2.189"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
oo-core = { path = "../oo-core" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "time", "io-util", "sync"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
