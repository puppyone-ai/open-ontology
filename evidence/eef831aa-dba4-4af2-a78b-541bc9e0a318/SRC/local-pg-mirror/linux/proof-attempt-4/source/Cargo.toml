[package]
name = "local-pg-mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Read-only PostgreSQL snapshot into a local PostgreSQL database. Not an enterprise copy."

[workspace]
resolver = "3"

[dependencies]
oo-connectors = { path = "../../crates/oo-connectors" }
oo-core = { path = "../../crates/oo-core" }
oo-pipeline = { path = "../../crates/oo-pipeline" }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-no-roots"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# Fresh resolves otherwise select newer crates.io releases. These exact
# versions are already checksummed in the fixed root lock.
cc = { version = "=1.4.7", default-features = false }
crypto-common = { version = "=0.1.6", default-features = false }
ctutils = { version = "=0.4.2", default-features = false }
either = { version = "=1.18.0", default-features = false }
find-msvc-tools = { version = "=0.1.13", default-features = false }
generic-array = { version = "=0.14.9", default-features = false }
js-sys = { version = "=0.3.105", default-features = false }
libc = { version = "=0.2.189", default-features = false }
mio = { version = "=1.2.3", default-features = false }
wasm-bindgen = { version = "=0.2.128", default-features = false }
wasm-bindgen-macro = { version = "=0.2.128", default-features = false }
wasm-bindgen-macro-support = { version = "=0.2.128", default-features = false }
wasm-bindgen-shared = { version = "=0.2.128", default-features = false }
web-sys = { version = "=0.3.105", default-features = false }
yoke-derive = { version = "=0.8.2", default-features = false }

[dev-dependencies]
oo-pipeline = { path = "../../crates/oo-pipeline" }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[patch.crates-io]
sqlx-core = { path = "../../crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "../../crates/oo-connectors/vendor/sqlx-postgres" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
