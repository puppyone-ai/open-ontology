[package]
name = "file-import-pg"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Replace-only CSV, TSV, and JSONL import into an unpublished PostgreSQL shadow."

[workspace]
resolver = "3"

[dependencies]
arrow-array = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
oo-connectors = { path = "../../crates/oo-connectors" }
oo-core = { path = "../../crates/oo-core" }
oo-pipeline = { path = "../../crates/oo-pipeline" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-no-roots"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
arrow-array = { version = "=60.0.0", default-features = false }
arrow-schema = { version = "=60.0.0", default-features = false }
oo-connectors = { path = "../../crates/oo-connectors" }
oo-core = { path = "../../crates/oo-core" }
oo-pipeline = { path = "../../crates/oo-pipeline" }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }

[patch.crates-io]
sqlx-core = { path = "../../crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "../../crates/oo-connectors/vendor/sqlx-postgres" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
