[package]
name = "oo-core"
description = "Shared configuration, ontology, batch, API, and canonical-value contracts."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# arbitrary_precision keeps JSON number lexemes as strings. It is workspace-wide
# for this pin. float_roundtrip stays off here; jsonschema enables it for its
# own dependency edge. Amounts still deserialize only from decimal strings.
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["serialize", "deserialize"] }
jsonschema = { version = "=0.57.0", default-features = false }
utoipa = { version = "=6.0.0", default-features = false, features = ["macros"] }
utoipa-gen = "=6.0.0"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
thiserror = "=2.0.21"
# IANA civil time. `std` only: clock, wasmbind, and oldtime stay off so this
# crate does not read the host zone or pull wasm-bindgen.
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
# Transitive pins. These crates are not product APIs. oo-core does not decode
# character sets and does not call encoding_rs, smallvec, zerocopy, or utoipa-gen.
# encoding_rs stays pinned at 0.8.41 because serde-saphyr's encoding_rs_io
# depends on encoding_rs 0.8, and 0.8.42 was still inside the 168-hour window
# on 2026-10-01. The pin is not a GB18030 decoder.
encoding_rs = "=0.8.41"
# phf_shared, pulled by chrono-tz's prebuilt zone table, depends on siphasher ^1.0.
# 1.0.4 was published 2026-09-25 and is inside the 168-hour window. 1.0.3 is the pin.
# oo-core does not call siphasher.
siphasher = "=1.0.3"
smallvec = "=1.16.1"
zerocopy = { version = "=0.8.57", default-features = false, features = ["simd"] }

[lints]
workspace = true

