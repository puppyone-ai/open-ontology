[workspace]
resolver = "3"

[package]
name = "oo-sql-runner"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "Apache-2.0"
publish = false
description = "Run explicit trusted SQL trials through query-pg, the adapter, and the comparator."

[[bin]]
name = "sql-runner"
path = "src/main.rs"

[dependencies]
oo-core = { path = "../../crates/oo-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
