[package]
name = "session-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Local-fixture bounded release orchestrator for the durable session store. Not a production sandbox."

[workspace]
resolver = "3"

[dependencies]
session-store = { path = "../session-store" }
session-transition = { path = "../session-transition" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
