[package]
name = "session-control-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "MIT OR Apache-2.0"
description = "Own-session create, event, and localprocess close API. Not a production signature."

[workspace]
resolver = "3"

[lib]
name = "session_control_api"
path = "src/lib.rs"

[[bin]]
name = "session-control-api"
path = "src/main.rs"

[dependencies]
session-store = { path = "../session-store" }
session-transition = { path = "../session-transition" }
session-release = { path = "../session-release" }
gateway-token-store = { path = "../gateway-token-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[dev-dependencies]
serde_json = "=1.0.151"
session-store = { path = "../session-store" }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
too_many_arguments = "allow"
cognitive_complexity = "allow"
uninlined_format_args = "allow"
