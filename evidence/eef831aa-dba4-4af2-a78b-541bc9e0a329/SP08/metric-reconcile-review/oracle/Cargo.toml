[package]
name = "a329-metric-review"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Independent review oracle for metric-reconcile. Not a product crate."

[workspace]

[dependencies]
metric-reconcile = { path = "/src/tools/metric-reconcile" }
oo-gateway = { path = "/src/crates/oo-gateway", version = "=0.1.0" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
