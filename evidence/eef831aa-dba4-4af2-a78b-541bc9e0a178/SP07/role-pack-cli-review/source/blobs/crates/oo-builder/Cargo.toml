[package]
name = "oo-builder"
description = "Ontology builder. Structure-draft compiles catalog evidence into a reviewable OOS draft. It does not connect, classify, certify, or publish."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
oo-core = { path = "../oo-core" }
oo-jobs = { path = "../oo-jobs" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
unicode-normalization = "=0.1.25"

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
unicode-normalization = "=0.1.25"
