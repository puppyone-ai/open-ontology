[workspace]
resolver = "3"

[package]
name = "oo-gateway-http-baseline-probe"
description = "Evidence-only loopback probe for the unapproved gateway HTTP baseline. Not a product API."
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.0.0"

[dependencies]
# Canonical pins. Root [workspace.dependencies] repeats these three.
# This package is its own workspace so oo-arch-check does not gain a member.
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tower = { version = "=0.5.3", default-features = false, features = ["limit", "make", "timeout", "util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["limit", "timeout"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Overlap controls copied from the frozen root lock. Not probe APIs.
atomic-waker = { version = "=1.1.2", default-features = false }
axum-core = { version = "=0.5.6", default-features = false }
bitflags = { version = "=2.13.2", default-features = false }
bytes = { version = "=1.12.1", default-features = false }
futures-channel = { version = "=0.3.34", default-features = false }
futures-core = { version = "=0.3.34", default-features = false }
futures-sink = { version = "=0.3.34", default-features = false }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
http = { version = "=1.5.0", default-features = false }
http-body = { version = "=1.1.0", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
httparse = { version = "=1.10.1", default-features = false }
httpdate = { version = "=1.0.3", default-features = false }
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
itoa = { version = "=1.0.18", default-features = false }
libc = { version = "=0.2.189", default-features = false }
log = { version = "=0.4.34", default-features = false }
matchit = { version = "=0.8.4", default-features = false }
memchr = { version = "=2.8.3", default-features = false }
mime = { version = "=0.3.17", default-features = false }
mio = { version = "=1.2.3", default-features = false }
once_cell = { version = "=1.21.4", default-features = false }
percent-encoding = { version = "=2.3.2", default-features = false }
pin-project-lite = { version = "=0.2.17", default-features = false }
proc-macro2 = { version = "=1.0.107", default-features = false }
quote = { version = "=1.0.47", default-features = false }
serde_core = { version = "=1.0.229", default-features = false }
smallvec = { version = "=1.16.1", default-features = false }
socket2 = { version = "=0.6.5", default-features = false }
sync_wrapper = { version = "=1.0.2", default-features = false }
syn-2 = { package = "syn", version = "=2.0.119", default-features = false }
syn-3 = { package = "syn", version = "=3.0.6", default-features = false }
tokio-macros = { version = "=2.7.2", default-features = false }
tokio-util = { version = "=0.7.19", default-features = false }
tower-layer = { version = "=0.3.3", default-features = false }
tower-service = { version = "=0.3.3", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
tracing-attributes = { version = "=0.1.31", default-features = false }
tracing-core = { version = "=0.1.36", default-features = false }
try-lock = { version = "=0.2.5", default-features = false }
unicode-ident = { version = "=1.0.26", default-features = false }
want = { version = "=0.3.1", default-features = false }
wasi-preview1 = { package = "wasi", version = "=0.11.1", default-features = false }
windows-link = { version = "=0.2.1", default-features = false }
windows-sys-0-61 = { package = "windows-sys", version = "=0.61.2", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
