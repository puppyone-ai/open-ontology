[workspace]
resolver = "3"
members = [
    "crates/oo-core",
    "crates/oo-jobs",
    "crates/oo-control",
    "crates/oo-connectors",
    "crates/oo-pipeline",
    "crates/oo-builder",
    "crates/oo-gateway",
    "crates/oo-sdk",
    "crates/oo-cli",
    "crates/oo-mcp",
    "crates/oo-proxy",
    "crates/oo-sandbox",
    "crates/oo-entry",
    "crates/oo-eval",
    "crates/oo-analysis",
    "crates/oo-arch-check",
    "crates/xtask",
    "a211-harness",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.1.0"

# Product crates have no features in SP00-W01. Reviewed combinations for
# dependencies that are not admitted yet live in supply-chain/dependency-baseline.json.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Modified upstream artifacts: crates.io sqlx-core 0.9.0 and sqlx-postgres
# 0.9.0 plus the hunks, license bodies, and compile-time feature guard in
# crates/oo-connectors/vendor/PATCH.md. SBOM identity is this patched tree
# together with the original tarball checksums.
[patch.crates-io]
sqlx-core = { path = "crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "crates/oo-connectors/vendor/sqlx-postgres" }
