[workspace]
resolver = "3"

[package]
name = "description-provider"
description = "One HTTPS chat-completion call that feeds the description-candidate compiler."
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.1.0"

[dependencies]
oo-builder = { path = "../../crates/oo-builder", version = "=0.1.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
# Same transitive pins oo-sdk keeps for reqwest 0.13.5. Not provider APIs.
hyper-util = { version = "=0.1.20", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
cc = "=1.4.7"
find-msvc-tools = "=0.1.13"
yoke-derive = "=0.8.2"

[dev-dependencies]
oo-builder = { path = "../../crates/oo-builder", version = "=0.1.0" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
