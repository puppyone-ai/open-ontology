[package]
name = "a286-fresh-bank"
version = "0.0.0"
edition = "2021"
publish = false
description = "Independent fresh hand bank for the a286 review. Not a product crate."

[[bin]]
name = "a286-fresh-bank"
path = "fresh_bank.rs"

[dependencies]
oo-question-bank = { path = "/src/benchmarks/question-bank" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
