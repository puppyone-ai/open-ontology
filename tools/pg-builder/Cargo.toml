[workspace]
resolver = "3"

[package]
name = "pg-builder"
description = "PostgreSQL evidence cards, loopback S5 drafts, and the existing description review bridge."
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.1.0"

[dependencies]
description-pack = { path = "../description-pack", version = "=0.1.0" }
description-review = { path = "../description-review", version = "=0.1.0" }
oo-builder = { path = "../../crates/oo-builder", version = "=0.1.0" }
oo-core = { path = "../../crates/oo-core", version = "=0.1.0" }
postgres-protocol = { version = "=0.6.12", default-features = false }
postgres-types = { version = "=0.2.14", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
