[package]
name = "oo-source-semantics-pack"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Call compile_source_semantics for one sealed Oracle catalog."

[[bin]]
name = "oo-source-semantics-pack"
path = "src/main.rs"

[dependencies]
oo-builder = { path = "../../../crates/oo-builder", version = "=0.1.0" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
source-semantics = { path = "../../source-semantics" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
