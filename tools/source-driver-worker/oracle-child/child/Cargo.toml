[package]
name = "oo-oracle-p2-child"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false
license = "Apache-2.0"

[[bin]]
name = "oo-oracle-p2-child"
path = "src/main.rs"

[dependencies]
oracledb = { version = "=26.0.0-beta.4", features = ["arrow"] }
arrow-array = "=59.3.0"
arrow-ipc = "=59.3.0"
arrow-schema = "=59.3.0"
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(oci_cancel)"] }
