[package]
name = "clickhouse-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "MIT OR Apache-2.0"
description = "ClickHouse 26.8 controlled-preview admission. A denied decision does not import or call a model."

[workspace]

[dependencies]
source-admission = { path = "../source-admission" }
serde_json = "=1.0.151"

[patch.crates-io]
sqlx-core = { path = "../../crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "../../crates/oo-connectors/vendor/sqlx-postgres" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
