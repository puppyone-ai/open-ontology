[package]
name = "mongodb-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "MongoDB 8.0.32 controlled preview. Admitted native read still stops when the shared sealed import refuses engine mongodb."

[workspace]

[dependencies]
mongodb = { version = "=3.3.0", default-features = false, features = ["compat-3-0-0", "rustls-tls"] }
mongodb-internal-macros = "=3.3.0"
oo-builder = { path = "../../crates/oo-builder" }
oo-core = { path = "../../crates/oo-core" }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
source-admission = { path = "../source-admission" }
tokio = { version = "=1.53.1", features = ["rt", "time", "sync", "net", "macros", "io-util"] }

[patch.crates-io]
sqlx-core = { path = "../../crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "../../crates/oo-connectors/vendor/sqlx-postgres" }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
