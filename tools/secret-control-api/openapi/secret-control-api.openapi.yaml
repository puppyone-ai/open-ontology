openapi: 3.0.3
info:
  title: oo.secret-control
  version: 1.0.0
  description: >
    Secret write, rotate, revoke, and workload resolve for card
    eef831aa-dba4-4af2-a78b-541bc9e0a384. Management responses never contain a
    secret value. customer_kms is an external gate. mtls_ca is not issued.
    This document does not accept SP02-W04.
servers:
  - url: "{https_origin}"
    variables:
      https_origin:
        default: https://127.0.0.1
security: []
paths:
  /control/v1/projects/{project_id}/namespaces/{namespace}/secrets/{secret_id}:
    parameters:
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/namespace"
      - $ref: "#/components/parameters/secret_id"
    put:
      operationId: putSecret
      parameters:
        - $ref: "#/components/parameters/csrf"
        - $ref: "#/components/parameters/origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/write-request.schema.json
      responses:
        "201":
          description: Version 1 metadata. No value field.
          content:
            application/json:
              schema:
                $ref: ../schema/metadata.schema.json
        "200":
          description: Idempotent replay of the same request bytes.
          content:
            application/json:
              schema:
                $ref: ../schema/metadata.schema.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    get:
      operationId: getSecretStatus
      responses:
        "200":
          description: Metadata plus the OIDC subject. No value field.
          content:
            application/json:
              schema:
                $ref: ../schema/status.schema.json
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /control/v1/projects/{project_id}/namespaces/{namespace}/secrets/{secret_id}/rotate:
    parameters:
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/namespace"
      - $ref: "#/components/parameters/secret_id"
    post:
      operationId: rotateSecret
      parameters:
        - $ref: "#/components/parameters/csrf"
        - $ref: "#/components/parameters/origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/rotate-request.schema.json
      responses:
        "200":
          description: New current version metadata. No value field.
          content:
            application/json:
              schema:
                $ref: ../schema/metadata.schema.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /control/v1/projects/{project_id}/namespaces/{namespace}/secrets/{secret_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/project_id"
      - $ref: "#/components/parameters/namespace"
      - $ref: "#/components/parameters/secret_id"
    post:
      operationId: revokeSecret
      parameters:
        - $ref: "#/components/parameters/csrf"
        - $ref: "#/components/parameters/origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/revoke-request.schema.json
      responses:
        "200":
          description: Revoked metadata. No value field.
          content:
            application/json:
              schema:
                $ref: ../schema/metadata.schema.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /component/v1/resolve:
    post:
      operationId: resolveSecret
      description: >
        Client-certificate workload URI is the authority. The value field is
        present only on this operation. A management cookie is not authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schema/resolve-request.schema.json
      responses:
        "200":
          description: Plaintext in value for the active current version only.
          content:
            application/json:
              schema:
                $ref: ../schema/resolve.schema.json
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
components:
  parameters:
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"
    namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"
    secret_id:
      name: secret_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,62}$"
    csrf:
      name: X-OO-CSRF
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
    origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
  responses:
    Error:
      description: Static error. retryable is true only for dependency.not_ready and commit.unknown.
      content:
        application/json:
          schema:
            $ref: ../schema/error.schema.json
