[workspace]
resolver = "3"

[package]
name = "ontology-dialogue"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Trusted-operator natural-language proposal and reviewed query-pg execution."

[dependencies]
answer-citations = { path = "../answer-citations", version = "=0.1.0" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
# Same direct pins description-provider keeps for reqwest 0.13.5. Not dialogue APIs.
hyper-util = { version = "=0.1.20", default-features = false }
tokio-rustls = { version = "=0.26.5", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
cc = "=1.4.7"
find-msvc-tools = "=0.1.13"
yoke-derive = "=0.8.2"

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
postgres-types = { version = "=0.2.14", default-features = false }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
