[package]
name = "pi-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Async Pi RPC harness adapter. Development local process only. Does not accept the parent harness."

[workspace]
resolver = "3"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[[bin]]
name = "pi-harness-stub"
path = "src/bin/stub.rs"

[[bin]]
name = "pi-harness-live"
path = "src/bin/live.rs"

[[bin]]
name = "fixture-provider"
path = "src/bin/provider.rs"
