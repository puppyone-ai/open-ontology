[package]
name = "source-conformance"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Check support-matrix claims against conformance evidence. Does not promote grades."

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }

[profile.dev]
debug = 0
incremental = false

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
