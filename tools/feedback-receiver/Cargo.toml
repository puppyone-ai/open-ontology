[package]
name = "feedback-receiver"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Bounded untrusted feedback receiver. Review candidates only. Not a grant or a publisher."

[workspace]
resolver = "3"

[dependencies]
audit-ingest = { path = "../audit-ingest", version = "=0.1.0" }
selfbuild-suggestions = { path = "../selfbuild-suggestions", version = "=0.1.0" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
postgres-types = { version = "=0.2.14", default-features = false }
postgres-protocol = { version = "=0.6.12", default-features = false }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[dev-dependencies]
selfbuild-suggestions = { path = "../selfbuild-suggestions", version = "=0.1.0" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }

[[bin]]
name = "feedback-receiver"
path = "src/bin/feedback_receiver.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
