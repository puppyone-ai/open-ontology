[package]
name = "identity-binding-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "HTTPS client of control-identity management binding preview and approve. Not an identity provider."

[workspace]
resolver = "3"

[[bin]]
name = "identity-binding-api"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.22.1"
getrandom = { version = "=0.2.17", default-features = false, features = ["std"] }
postgres-protocol = { version = "=0.6.12", default-features = false }
postgres-types = { version = "=0.2.14", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }
tower = { version = "=0.5.3", default-features = false, features = ["limit", "make", "timeout", "util"] }
tower-http = { version = "=0.6.11", default-features = false, features = ["limit", "timeout"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }
# Root-lock versions only. default-features stays off so these pins do not
# enable optional crates the workspace lock never compiled.
cc = { version = "=1.4.7", default-features = false }
crypto-common = { version = "=0.1.6", default-features = false }
ctutils = { version = "=0.4.2", default-features = false }
find-msvc-tools = { version = "=0.1.13", default-features = false }
generic-array = { version = "=0.14.9", default-features = false }
h2 = { version = "=0.4.19", default-features = false }
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
js-sys = { version = "=0.3.105", default-features = false }
libc = { version = "=0.2.189", default-features = false }
mio = { version = "=1.2.3", default-features = false }
quinn-proto = { version = "=0.11.18", default-features = false }
quinn-udp = { version = "=0.5.15", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
rustls-platform-verifier-android = { version = "=0.1.1", default-features = false }
siphasher = { version = "=1.0.3", default-features = false }
smallvec = { version = "=1.16.1", default-features = false }
want = { version = "=0.3.1", default-features = false }
wasm-bindgen = { version = "=0.2.128", default-features = false }
wasm-bindgen-futures = { version = "=0.4.78", default-features = false }
wasm-bindgen-macro = { version = "=0.2.128", default-features = false }
wasm-bindgen-macro-support = { version = "=0.2.128", default-features = false }
wasm-bindgen-shared = { version = "=0.2.128", default-features = false }
web-sys = { version = "=0.3.105", default-features = false }
yoke-derive = { version = "=0.8.2", default-features = false }

[dev-dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "=0.22.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
ring = "=0.17.14"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["aws-lc-rs"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["tls12", "aws-lc-rs"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
