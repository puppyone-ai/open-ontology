[package]
name = "local-analysis"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Bounded local analysis of one verified query-result-export. Child deps are pinned and unaudited."

[workspace]

[[bin]]
name = "local-analysis"
path = "src/main.rs"

[dependencies]
arrow = { version = "=60.0.0", default-features = false, features = ["ipc"] }
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "snap"] }
rust_xlsxwriter = { version = "=0.99.1", default-features = false }

[dev-dependencies]
zip = { version = "=8.3.0", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
