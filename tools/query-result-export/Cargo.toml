[package]
name = "query-result-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Export one typed query-pg stdout to a bounded formula-safe CSV and sidecar."

[workspace]

[[bin]]
name = "query-result-export"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
