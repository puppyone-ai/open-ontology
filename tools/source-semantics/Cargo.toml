[workspace]
resolver = "3"

[package]
name = "source-semantics"
description = "Normalize source semantics onto a captured catalog and a fixed role pack."
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.1.0"

[dependencies]
oo-builder = { path = "../../crates/oo-builder", version = "=0.1.0" }
oo-core = { path = "../../crates/oo-core", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[dev-dependencies]
oo-builder = { path = "../../crates/oo-builder", version = "=0.1.0" }
oo-core = { path = "../../crates/oo-core", version = "=0.1.0" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
