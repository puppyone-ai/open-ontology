[package]
name = "mariadb-preview"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.94.0"
description = "MariaDB sealed import and controlled preview. Not a MySQL adapter."

[workspace]
resolver = "3"
members = [".", "ext/mariadb-probe"]

# The mounted probe inherits these. They are the same fields as
# testing/dl01-driver-preflight/mariadb/Cargo.toml in this commit.
[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.94.0"
version = "0.1.0"

[dependencies]
mariadb-probe = { path = "ext/mariadb-probe" }
minimal-product-loop = { path = "../minimal-product-loop" }
oo-builder = { path = "../../crates/oo-builder" }
oo-connectors = { path = "../../crates/oo-connectors" }
oo-core = { path = "../../crates/oo-core" }
oo-pipeline = { path = "../../crates/oo-pipeline" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
source-admission = { path = "../source-admission" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres"] }
sqlx-core = { version = "=0.9.0", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-no-roots"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
mysql_async = { version = "=0.36.1", default-features = false, features = ["minimal", "rustls-tls", "ring"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
sqlx-core = { path = "../../crates/oo-connectors/vendor/sqlx-core" }
sqlx-postgres = { path = "../../crates/oo-connectors/vendor/sqlx-postgres" }
