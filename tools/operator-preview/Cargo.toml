[package]
name = "operator-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
license = "Apache-2.0"
description = "Trusted local operator preview for one sealed target. Not a public query gate."

[workspace]
resolver = "3"

[dependencies]
gateway-audit-wal = { path = "../gateway-audit-wal" }
oo-gateway = { path = "../../crates/oo-gateway" }
getrandom = { version = "=0.2.17", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[dev-dependencies]
gateway-audit-wal = { path = "../gateway-audit-wal" }
minimal-product-loop = { path = "../minimal-product-loop" }
oo-builder = { path = "../../crates/oo-builder" }
oo-gateway = { path = "../../crates/oo-gateway" }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[[bin]]
name = "operator-preview"
path = "src/main.rs"

[lib]
name = "operator_preview"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
