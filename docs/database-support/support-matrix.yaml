# Open Ontology 数据库支持矩阵（初稿，手工维护）
#
# 重要：
#  - 当前没有任何目标处于 verified/certified。verified 起的单元格必须由证据包生成，不得手写。
#  - 等级含义见 docs/database-support/01-admission-and-support-matrix.md。
#  - 未出现在本文件的数据库一律视为不支持（CONNECTOR_UNSUPPORTED）。
#  - 能力缩写：cat=catalog, logic, qlog=query_log, full=batch_full, inc=batch_incremental,
#    feed=change_feed, cdc, del=delete(native|reconcile|none), snap=snapshot_token, rep=replica_read, bud=budget
#  - grade：T 事务 / S1 同 token 快照 / S0 单表快照 / B 尽力（见 03 §3）
schema: oo-support-matrix/v1
captured: 2026-10-09
levels: [candidate, designed, experimental, verified, certified, excluded]
note: "initial hand-written draft; no evidence packs exist yet"

