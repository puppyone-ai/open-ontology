<text x="754" y="380" font-size="13" text-anchor="start" font-weight="normal" class="small" style="fill:#856033">04 / GOVERN</text>
<text x="754" y="404" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">Gateway</text>
<text x="754" y="433" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Identity + SQL guard</text>
<text x="754" y="458" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Role / RLS + budgets</text>
<text x="754" y="483" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Durable audit</text>
<path d="M 976 360 Q 1103.0 356 1230 360 Q 1241 362 1238 371 L 1237 483 Q 1238 495 1226 493 Q 1103.0 496 976 492 Q 964 492 969 480 L 968 371 Q 967 360 976 360 Z" fill="#CCE9DA" stroke="#292724" stroke-width="2.1"/>
<path d="M 979 356 Q 1143.5 354 1230 357" fill="none" stroke="#292724" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="983" y="380" font-size="13" text-anchor="start" font-weight="normal" class="small" style="fill:#856033">05 / CONSUME</text>
<text x="983" y="404" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">Your agent / harness</text>
<text x="983" y="433" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">OO CLI / HTTP / SDK</text>
<text x="983" y="458" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">MCP where verified</text>
<text x="983" y="483" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Internal chat is optional</text>
