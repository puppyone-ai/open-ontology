<text x="57" y="380" font-size="13" text-anchor="start" font-weight="normal" class="small" style="fill:#856033">01 / REGISTER</text>
<text x="57" y="404" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">Source systems</text>
<text x="57" y="433" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Databases + files</text>
<text x="57" y="458" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Read-only account</text>
<text x="57" y="483" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Budgeted extraction</text>
<path d="M 274 360 Q 358.5 356 443 360 Q 454 362 451 371 L 450 483 Q 451 495 439 493 Q 358.5 496 274 492 Q 262 492 267 480 L 266 371 Q 265 360 274 360 Z" fill="white" stroke="#292724" stroke-width="2.1"/>
