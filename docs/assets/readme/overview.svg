<text x="57" y="569" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">B1: no source writes     B2: pipeline writes only     B3: access stays within user permissions</text>
<text x="40" y="637" font-size="14" text-anchor="start" font-weight="normal" class="small" style="fill:#71695D">DATA FLOW · Replicated data and reviewed context meet at the Gateway.</text>
