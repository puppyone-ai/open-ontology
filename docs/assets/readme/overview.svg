<text x="387" y="205" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">S0–S10: facts → draft → review</text>
<text x="387" y="230" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">YAML + curated overlays + Git</text>
