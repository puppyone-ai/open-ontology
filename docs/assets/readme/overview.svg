<text x="57" y="205" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Configuration / identity</text>
<text x="57" y="230" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Review / version / evaluation</text>
