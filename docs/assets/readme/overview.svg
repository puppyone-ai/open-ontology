<text x="281" y="380" font-size="13" text-anchor="start" font-weight="normal" class="small" style="fill:#856033">02 / REPLICATE</text>
<text x="281" y="404" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">Sync pipeline</text>
<text x="281" y="433" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Capture batches</text>
<text x="281" y="458" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Snapshot + changes</text>
<text x="281" y="483" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Apply + CAS / ACK</text>
<path d="M 498 360 Q 594.0 356 690 360 Q 701 362 698 371 L 697 483 Q 698 495 686 493 Q 594.0 496 498 492 Q 486 492 491 480 L 490 371 Q 489 360 498 360 Z" fill="white" stroke="#292724" stroke-width="2.1"/>
<path d="M 501 356 Q 625.2 354 690 357" fill="none" stroke="#292724" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="505" y="380" font-size="13" text-anchor="start" font-weight="normal" class="small" style="fill:#856033">03 / PRESERVE</text>
<text x="505" y="404" font-size="22" text-anchor="start" font-weight="bold" style="fill:#292724">Agent DB / PG</text>
<text x="505" y="433" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Typed local replica</text>
<text x="505" y="458" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Position + quality state</text>
<text x="505" y="483" font-size="17" text-anchor="start" font-weight="normal" style="fill:#292724">Pipeline-only writes</text>
<path d="M 747 360 Q 833.0 356 919 360 Q 930 362 927 371 L 926 483 Q 927 495 915 493 Q 833.0 496 747 492 Q 735 492 740 480 L 739 371 Q 738 360 747 360 Z" fill="#FFE3B9" stroke="#292724" stroke-width="2.1"/>
